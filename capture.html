<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Obra — Canvas 27</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="logoCanvas27.png" type="image/png">
</head>
<body class="capture-page" data-page="capture">

    <header class="capture-header py-3">
        <div class="container">
            <nav class="capture-nav d-flex flex-wrap justify-content-between align-items-center gap-2">
                <a href="index.html" class="capture-header__logo">
                    <img src="LogoCanvas27W.svg" alt="Canvas 27" height="40">
                </a>
                <ul class="capture-nav__links list-unstyled d-flex flex-wrap gap-3 mb-0">
                    <li><a href="gallery.html">Galería</a></li>
                    <li><a href="capture.html" class="nav-active">Subir Obra</a></li>
                    <li><a href="register.html">Registro</a></li>
                </ul>
                <button type="button" class="btn btn-outline-canvas btn-sm" id="logout-btn">Cerrar sesión</button>
            </nav>
        </div>
    </header>

    <main class="container py-4 py-md-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8 col-xl-7">
                <header class="text-center mb-4">
                    <h1 class="capture-title mb-2">Publica tu obra</h1>
                    <p class="text-muted">Selecciona una imagen de tu galería para agregarla a Canvas 27</p>
                </header>

                <div id="capture-alert" class="alert d-none" role="alert"></div>

                <form id="upload-form" class="upload-panel card border-0 shadow-lg" enctype="multipart/form-data">
                    <div class="card-body p-3 p-md-4">
                        
                        <!-- Input de archivo -->
                        <div class="mb-3">
                            <label for="photo-file" class="form-label">Seleccionar imagen</label>
                            <input type="file" class="form-control canvas-input" id="photo-file" name="file" accept="image/*" required>
                        </div>

                        <!-- Vista previa de la imagen seleccionada -->
                        <div id="preview-container" class="mb-3 d-none text-center">
                            <img id="photo-preview" class="img-fluid rounded border shadow-sm max-vh-50" alt="Vista previa de la obra">
                        </div>

                        <!-- Título de la obra -->
                        <div class="mb-4">
                            <label for="photo-title" class="form-label">Título de la obra</label>
                            <input type="text" class="form-control canvas-input" id="photo-title" name="title" placeholder="Ej. Atardecer en el lienzo" maxlength="120" required>
                        </div>

                        <button type="submit" class="btn btn-canvas w-100 btn-lg" id="upload-photo-btn">
                            Guardar en la galería
                        </button>

                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
